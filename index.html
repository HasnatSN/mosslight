  <body>
    <main>
      <header class="masthead">
        <a href="./" aria-label="Mosslight home"
          ><span class="brand-mark" aria-hidden="true">✦</span> MOSSLIGHT</a
        ><span class="edition">THE BELLKEEPER'S TRIAL <i></i> AN ORIGINAL PIXEL ADVENTURE</span
        ><button id="fullscreen" title="Fullscreen (F)">
          EXPAND <span aria-hidden="true">↗</span>
        </button>
      </header>
      <div id="game-frame">
        <canvas
          id="game"
          width="384"
          height="216"
          tabindex="0"
          aria-label="Mosslight game. Move with arrow keys or W A S D. Interact with E, Space or Enter. Escape opens the field menu."
        ></canvas>
        <div id="accessible-controls" class="sr-only" aria-label="Game actions"></div>
        <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
        <section id="touch-controls" aria-label="Touch controls" data-mode="menu" hidden>
          <div id="touch-pad" role="group" aria-label="Movement" hidden>
            <button type="button" data-direction="up" aria-label="Move up" aria-pressed="false">
              <span aria-hidden="true">▲</span>
            </button>
            <button type="button" data-direction="left" aria-label="Move left" aria-pressed="false">
              <span aria-hidden="true">◀</span>
            </button>
            <span class="touch-pad-center" aria-hidden="true">✦</span>
            <button
              type="button"
              data-direction="right"
              aria-label="Move right"
              aria-pressed="false"
            >
              <span aria-hidden="true">▶</span>
            </button>
            <button type="button" data-direction="down" aria-label="Move down" aria-pressed="false">
              <span aria-hidden="true">▼</span>
            </button>
          </div>
          <div id="touch-content">
            <div id="touch-copy" hidden>
              <h2 id="touch-heading"></h2>
              <p id="touch-caption"></p>
            </div>
            <div id="touch-menu" role="group" aria-label="Game actions" hidden></div>
          </div>
          <div id="touch-actions" role="group" aria-label="Exploration actions" hidden>
            <button type="button" id="touch-run" aria-pressed="false">Run</button>
            <button type="button" id="touch-confirm">Interact</button>
            <button type="button" id="touch-back">Menu</button>
          </div>
        </section>
        <button type="button" id="exit-immersive" aria-label="Exit full view">
          Exit full view ↙
        </button>
      </div>
      <footer>
        <div class="control-guide">
          <span><kbd>W A S D</kbd> MOVE</span><span><kbd>E</kbd> INTERACT / CONFIRM</span
          ><span><kbd>ESC</kbd> JOURNAL & OPTIONS</span>
        </div>
        <span class="footer-note">A LITTLE LIGHT GOES A LONG WAY.</span>
        <span class="touch-hint">Turn your phone sideways for a larger view.</span>
      </footer>
    </main>
  </body>
</html>
